version: '3.8'

services:
  # Relational Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: skillbridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillbridge_user
      POSTGRES_PASSWORD: skillbridge_secure_password
      POSTGRES_DB: skillbridge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge_user -d skillbridge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillbridge_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://skillbridge_user:skillbridge_secure_password@postgres:5432/skillbridge_db
      ALLOWED_ORIGINS: http://localhost:80,http://localhost:5173,http://localhost
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # React / Vite Frontend (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: skillbridge_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
