services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: skillbridge-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://skillbridge-frontend.onrender.com
      - key: ENVIRONMENT
        value: production

  # 2. React Vite Frontend Static Site
  - type: web
    name: skillbridge-frontend
    env: static
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://skillbridge-backend.onrender.com

databases:
  # 3. Managed PostgreSQL Database
  - name: skillbridge-postgres
    databaseName: skillbridge_prod
    user: skillbridge_admin
    region: oregon
    plan: starter
